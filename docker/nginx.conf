server {
    listen 80;
    root /usr/share/nginx/html;

    # expo-router maneja las rutas en el navegador: todo lo que no sea un
    # archivo existente devuelve la app.
    location / {
        # El entorno local siempre debe mostrar el bundle recién reconstruido.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
